services:
  labelstudio:
    image: heartexlabs/label-studio:latest
    volumes:
      - /root/labelstudio/data:/label-studio/data
      - /root/labelstudio/files:/label-studio/files
    environment:
      - CSRF_TRUSTED_ORIGINS=https://labelstudio.krzyzanowski.dev
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
  nginx:
    build: nginx
    volumes:
      - type: bind
        source: /root/acme-host/certs
        target: /root/acme-host/certs
        read_only: true
    ports:
      - "10.13.13.1:443:443"
