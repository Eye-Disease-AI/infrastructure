# generated 2025-06-02, Mozilla Guideline v5.7, nginx 1.27.3, OpenSSL 3.4.0, intermediate config
# https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=intermediate&openssl=3.4.0&guideline=5.7

server {
	server_name labelstudio.krzyzanowski.dev;

	listen 443 ssl;
	listen [::]:443 ssl;
	#http2 on;
	ssl_certificate /root/acme-host/certs/labelstudio.krzyzanowski.dev/fullchain.pem;
	ssl_certificate_key /root/acme-host/certs/labelstudio.krzyzanowski.dev/key.pem;

    	client_max_body_size 4096m;

	# HSTS (ngx_http_headers_module is required) (63072000 seconds)
	add_header Strict-Transport-Security "max-age=63072000" always;

	location / {
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Url-Scheme $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Host $http_host;
		proxy_pass http://labelstudio:8080/;
	}

	# Tries to improve the performance:
	ssl_stapling on;
	ssl_stapling_verify on;
	keepalive_timeout 70;
	#limit_conn perip 10;
}

server {
	server_name mlflow.krzyzanowski.dev;

	listen 443 ssl;
	listen [::]:443 ssl;
	ssl_certificate /root/acme-host/certs/mlflow.krzyzanowski.dev/fullchain.pem;
	ssl_certificate_key /root/acme-host/certs/mlflow.krzyzanowski.dev/key.pem;
    	client_max_body_size 4096m;
	add_header Strict-Transport-Security "max-age=63072000" always;

	location / {
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Url-Scheme $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Host $http_host;
		proxy_pass http://mlflow:5000/;
	}

	ssl_stapling on;
	ssl_stapling_verify on;
	keepalive_timeout 70;
}

# intermediate configuration
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# see also ssl_session_ticket_key alternative to stateful session cache
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions

# curl https://ssl-config.mozilla.org/ffdhe2048.txt > /path/to/dhparam
ssl_dhparam "/dhparam";

